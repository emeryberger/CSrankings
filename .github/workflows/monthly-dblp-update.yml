name: Monthly DBLP Update

on:
  schedule:
    # Run at midnight UTC on the 28th of each month
    - cron: '0 0 28 * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      simulate_failure:
        description: >-
          Fail the update deliberately, to check that the failure notification
          still works. Without this the alerting path can only be exercised by
          waiting for a real breakage, which is how it stayed broken for seven
          months unnoticed. Costs a few seconds: it exits before the download.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-dblp:
    runs-on: ubuntu-latest

    steps:
      # Deliberately first, so testing the alert does not spend 19 minutes and
      # a full DBLP download getting to the failure.
      - name: Simulate a failure (notification test only)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "simulate_failure was set: failing on purpose to exercise the"
          echo "failure-notification path. No data was touched."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0  # Fetch full history for git pull --rebase

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run DBLP update
        run: |
          make update-dblp-full

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-commit: monthly DBLP update"
            
            # Retry logic to handle concurrent pushes (race condition fix)
            MAX_RETRIES=3
            RETRY_COUNT=0
            RETRY_DELAY=5
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES: Pushing changes..."
              
              if git push; then
                echo "Successfully pushed changes."
                exit 0
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "Push failed. Pulling with rebase and retrying in ${RETRY_DELAY}s..."
                  sleep $RETRY_DELAY
                  
                  # Pull with rebase to integrate remote changes
                  git pull --rebase origin gh-pages
                  
                  # Increase delay for next retry (exponential backoff)
                  RETRY_DELAY=$((RETRY_DELAY + 5))
                else
                  echo "Error: Failed to push after $MAX_RETRIES attempts."
                  exit 1
                fi
              fi
            done
          fi

  # The update ran unattended and broken for seven months (2025-12-31 through
  # 2026-06-28, every scheduled run OOM-killed during name-change detection,
  # fixed in #14027). Nothing announced it: the only outward sign was the DBLP
  # date on the site quietly not advancing, which went unnoticed until someone
  # looked. These two jobs make a failure speak up, and make the alert go away
  # by itself once the next run succeeds.
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: update-dblp
    # An OOM kill surfaces as a cancelled job, not a failed one -- that is
    # exactly how the historical failures presented -- so check both rather
    # than relying on failure() alone.
    if: ${{ always() && contains(fromJSON('["failure", "cancelled"]'), needs.update-dblp.result) }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the DBLP date currently on the site
        id: staleness
        run: |
          DATE=$(grep -oE 'DBLP</a> \([A-Za-z]+ [0-9]{4}\)' index.html \
                 | grep -oE '[A-Za-z]+ [0-9]{4}' || true)
          echo "date=${DATE:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Open or update the failure issue
        uses: actions/github-script@v7
        env:
          DBLP_DATE: ${{ steps.staleness.outputs.date }}
          JOB_RESULT: ${{ needs.update-dblp.result }}
        with:
          script: |
            const LABEL = 'dblp-update-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const dblpDate = process.env.DBLP_DATE;
            const result = process.env.JOB_RESULT;

            const detail = result === 'cancelled'
              ? 'The job was **cancelled**. When this happens unattended it usually ' +
                'means the runner was OOM-killed rather than that anyone stopped it ' +
                '-- that is how the 2025-12 through 2026-06 failures presented.'
              : 'The job **failed**.';

            const body = [
              `The monthly DBLP update did not complete, so publication data is not advancing.`,
              ``,
              `- Run: ${runUrl}`,
              `- Outcome: \`${result}\``,
              `- DBLP snapshot currently published on the site: **${dblpDate}**`,
              ``,
              detail,
              ``,
              `Until this succeeds, \`generated-author-info.csv\` and the rankings ` +
              `stay at the ${dblpDate} snapshot. The workflow can be re-run by hand ` +
              `from the Actions tab (\`Monthly DBLP Update\` -> Run workflow); it does ` +
              `not wait for the next 28th.`,
              ``,
              `This issue closes itself when a later run succeeds.`,
            ].join('\n');

            // Reuse one issue rather than filing a new one every month, so a
            // repeat failure reads as a continuing outage instead of a pile of
            // near-identical reports.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: `Failed again.\n\n${body}`,
              });
              core.notice(`Commented on existing issue #${number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Monthly DBLP update is failing (data stuck at ${dblpDate})`,
                body,
                labels: [LABEL],
              });
              core.notice(`Opened issue #${created.data.number}`);
            }

  resolve-on-success:
    runs-on: ubuntu-latest
    needs: update-dblp
    if: ${{ needs.update-dblp.result == 'success' }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Close any open failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'dblp-update-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `The monthly DBLP update succeeded: ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.notice(`Closed issue #${issue.number}`);
            }
