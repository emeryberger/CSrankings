name: Commit Validation

on:
  pull_request_target:
    types: [opened, synchronize, edited]
  # A reply can supply the evidence an assessment asked for.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to validate'
        required: true
        type: number

# Prevent multiple runs for the same PR from running simultaneously
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  commit_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Comments: only replies on PRs, and not from the maintainer or a bot.
    if: >-
      github.event_name != 'issue_comment' || (
      github.event.issue.pull_request &&
      github.event.comment.user.login != 'emeryberger' &&
      github.event.comment.user.type != 'Bot')
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate diff.json from PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NUMBER: ${{ env.PR_NUMBER }}
        run: python3 generate_diff.py

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.319

      # The token is from `claude setup-token`, so this uses the maintainer's
      # subscription. Without it, only the mechanical checks run.
      - name: Run mechanical checks and the VALIDATION.md assessment
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ASSESSMENT_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 util/validate_commit.py pr_metadata.json diff.json | tee pr_comment.txt

      - name: Save PR number
        run: |
          mkdir -p pr
          echo "${{ env.PR_NUMBER }}" > pr/pr_number.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            pr/pr_number.txt
            pr_comment.txt
            remove_stale.txt
            assessment.md
            assessment.json
          if-no-files-found: ignore

  post_comment:
    runs-on: ubuntu-latest
    needs: commit_validation
    if: ${{ !cancelled() && needs.commit_validation.result != 'skipped' }}

    permissions:
      pull-requests: write
      issues: write
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Post audit comment and manage labels / merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(<artifacts/pr/pr_number.txt)
          REPO="${{ github.repository }}"
          COMMENTS_URL="https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments"
          LABELS_URL="https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels"

          post_comment() {
            jq -Rs '{body: .}' < "$1" | curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$COMMENTS_URL" --data-binary @-
          }

          if [ -f artifacts/assessment.md ]; then
            post_comment artifacts/assessment.md
          fi

          # A reply gets a new assessment, but not the checks or label changes again.
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            exit 0
          fi

          if [ -f artifacts/pr_comment.txt ]; then
            COMMENT_JSON=$(jq -Rs . < artifacts/pr_comment.txt)
            EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" "$COMMENTS_URL")
            EXISTS=$(echo "$EXISTING" | jq -r '.[].body' | grep -Fxf artifacts/pr_comment.txt || true)

            echo "Posting validation result comment..."
            TMPFILE=$(mktemp)
            echo "{\"body\": $COMMENT_JSON}" > "$TMPFILE"

            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$COMMENTS_URL" \
              --data-binary "@$TMPFILE"
            rm -f "$TMPFILE"
          fi

          # A PR on hold is decided by a person, on their schedule.
          if curl -s -H "Authorization: token $GH_TOKEN" "$LABELS_URL" | jq -r '.[].name' | grep -q "^hold$"; then
            echo "PR is on hold. Leaving labels alone."
            exit 0
          fi

          # CASE 1: Checks FAILED or low score → add 'stale'
          if [ -f artifacts/remove_stale.txt ] && grep -q "false" artifacts/remove_stale.txt; then
            echo "Validation failed. Adding 'stale' label."
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$COMMENTS_URL" \
              -d '{"body": "Please address the failed validity checks above."}'

            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$LABELS_URL" \
              -d '{"labels": ["stale"]}'
            exit 0
          fi

          # CASE 2: Checks PASSED → remove 'stale', add 'validated'
          echo "Validation passed. Managing labels."

          EXISTING_LABELS=$(curl -s -H "Authorization: token $GH_TOKEN" "$LABELS_URL")
          if echo "$EXISTING_LABELS" | jq -r '.[].name' | grep -q "^stale$"; then
            echo "Removing 'stale' label."
            curl -s -X DELETE \
              -H "Authorization: token $GH_TOKEN" \
              "$LABELS_URL/stale"
          fi

          echo "Adding 'validated' label."
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$LABELS_URL" \
            -d '{"labels": ["validated"]}'

  auto_merge:
    runs-on: ubuntu-latest
    needs: [commit_validation, post_comment]
    if: ${{ !cancelled() && needs.post_comment.result == 'success' }}

    permissions:
      actions: write        # start the rebuild, which a GITHUB_TOKEN merge does not trigger
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Merge if every gate passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE }}
        run: |
          python3 util/auto_merge.py "$(cat artifacts/pr/pr_number.txt)" artifacts/assessment.json artifacts/remove_stale.txt
