name: Run Make and Commit Changes

on:
  push:
    branches:
      - gh-pages  # Runs only on merge to the main branch

permissions:
  contents: write  # Required to push changes back

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Compile TypeScript
        run: tsc --project tsconfig.json

      - name: Install test dependencies
        # requirements.txt as well as the test-only packages: the suite imports
        # util/ modules (e.g. validate_commit.py, which needs pydantic), so the
        # tests must run against the project's real dependencies.
        run: pip install -r requirements.txt pytest selenium webdriver-manager

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@latest

      # Deselect the `postmake` invariants (sort order, orcid.csv sync). They
      # can only be satisfied by `make`, which runs in the build job below --
      # gating that job on them deadlocks: the test fails, `make` never runs,
      # and the drift it reported is never repaired. They are re-run after
      # `make` in build-and-commit, where they are meaningful.
      - name: Run tests
        run: python3 -m pytest test/ -v -m "not postmake"

  build-and-commit:
    runs-on: ubuntu-latest
    needs: test  # Only run after tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # Required to push back
          fetch-depth: 0  # Fetch full history for git pull --rebase

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g google-closure-compiler
          # pytest is needed for the post-make invariant check below. selenium
          # and webdriver-manager are not exercised -- `-m postmake` deselects
          # the browser tests -- but test/test_incremental.py imports selenium
          # at module scope, so collection fails without them. No Chrome needed.
          pip install pytest selenium webdriver-manager

      - name: Run make
        run: |
          make

      # `make` is what normalizes the tree, so these run here rather than in
      # the gating job. A failure means `make` did not leave the tree in the
      # state it is supposed to -- a real defect in the build, not stale data.
      - name: Verify post-make invariants
        run: python3 -m pytest test/ -v -m postmake

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-commit: results of running make after merge"
            
            # Retry logic to handle concurrent pushes (race condition fix)
            MAX_RETRIES=3
            RETRY_COUNT=0
            RETRY_DELAY=5
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES: Pushing changes..."
              
              if git push; then
                echo "Successfully pushed changes."
                exit 0
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "Push failed. Pulling with rebase and retrying in ${RETRY_DELAY}s..."
                  sleep $RETRY_DELAY
                  
                  # Pull with rebase to integrate remote changes
                  git pull --rebase origin gh-pages
                  
                  # Increase delay for next retry (exponential backoff)
                  RETRY_DELAY=$((RETRY_DELAY + 5))
                else
                  echo "Error: Failed to push after $MAX_RETRIES attempts."
                  exit 1
                fi
              fi
            done
          fi
