name: Update Sponsors

on:
  schedule:
    # Run at midnight UTC on the 28th of each month
    - cron: '0 0 28 * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-sponsors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch sponsors from GitHub
        env:
          # Requires a PAT with read:org scope stored as SPONSORS_TOKEN secret
          GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: python3 util/update-sponsors.py

      - name: Commit and push changes
        run: |
          git add sponsors.json
          if git diff --cached --quiet; then
            echo "No changes to sponsors."
          else
            git commit -m "Update sponsors list"
            git push
          fi
